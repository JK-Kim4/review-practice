<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>감상 작성 — 질문하기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111113;text-decoration:none}a:hover{color:#2F4BE0}
</style>
</helmet>
<div style="min-height: 1180px; background: #F6F6F4; color: #111113; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; word-break: keep-all">
  <header style="background: #FFFFFF; border-bottom: 1px solid #E6E6E2">
    <div style="max-width: 960px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
      <a href="Main.dc.html" aria-label="닫기" style="width: 44px; height: 44px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111113" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18"></path><path d="M6 6l12 12"></path></svg>
      </a>
      <span style="display: flex; align-items: center; gap: 8px; font-size: 15px">
        <span style="font-size: 12px; font-weight: 600; color: #4A4A50; padding: 2px 8px; border-radius: 6px; background: #F0F0EC">공연</span>
        <strong style="font-weight: 600">갈매기</strong>
      </span>
      <span style="font-size: 13px; color: #66666C; min-width: 44px; text-align: right">저장됨</span>
    </div>
    <nav aria-label="작성 단계" style="max-width: 720px; margin: 0 auto; padding: 0 24px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <a href="Capture.dc.html" style="padding: 12px 0 14px; border-bottom: 2px solid transparent; font-size: 15px; color: #66666C; text-align: center">1 포착하기</a>
      <a href="Question.dc.html" aria-current="step" style="padding: 12px 0 14px; border-bottom: 2px solid #111113; font-size: 15px; font-weight: 600; text-align: center">2 질문하기</a>
      <a href="Compose.dc.html" style="padding: 12px 0 14px; border-bottom: 2px solid transparent; font-size: 15px; color: #66666C; text-align: center">3 정리하기</a>
    </nav>
  </header>

  <main style="max-width: 720px; margin: 0 auto; padding: 48px 24px 120px">
    <h1 style="margin: 0 0 10px; font-size: 32px; line-height: 1.3; font-weight: 700; letter-spacing: -0.03em">왜 그 장면이 남았을까요?</h1>
    <p style="margin: 0 0 28px; font-size: 16px; line-height: 1.6; color: #4A4A50">장면 하나를 골라 질문을 던져보세요. 모두 답하지 않아도 괜찮아요.</p>

    <div role="radiogroup" aria-label="질문할 장면" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 36px">
      <button type="button" role="radio" aria-checked="true" style="text-align: left; padding: 14px 18px; border-radius: 14px; border: 2px solid {{accent}}; background: #FFFFFF; font: inherit; font-size: 15px; line-height: 1.5; color: #111113; display: flex; gap: 12px; align-items: flex-start">
        <span style="width: 18px; height: 18px; margin-top: 2px; border-radius: 999px; border: 5px solid {{accent}}; box-sizing: border-box; flex: none"></span>
        니나가 자신의 고통을 이야기하면서도 배우로 살아가겠다는 의지를 보였다.
      </button>
      <button type="button" role="radio" aria-checked="false" style="text-align: left; padding: 14px 18px; border-radius: 14px; border: 1px solid #E6E6E2; background: #FFFFFF; font: inherit; font-size: 15px; line-height: 1.5; color: #4A4A50; display: flex; gap: 12px; align-items: flex-start">
        <span style="width: 18px; height: 18px; margin-top: 2px; border-radius: 999px; border: 1.5px solid #8A8A90; box-sizing: border-box; flex: none"></span>
        니나가 떠난 뒤 트레플레프에게 남겨진 시간
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <label style="display: flex; flex-direction: column; gap: 10px; padding: 20px 22px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E6E6E2">
        <span style="font-size: 15px; font-weight: 600">다른 장면보다 이것이 기억에 남은 이유는?</span>
        <textarea rows="2" style="border: 0; padding: 0; resize: none; font: inherit; font-size: 16px; line-height: 1.7; color: #111113; background: transparent; outline: none">불행을 말하면서도 삶을 포기하지 않는 모습이 모순적으로 느껴졌다.</textarea>
      </label>

      <div style="display: flex; flex-direction: column; gap: 10px; padding: 20px 22px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E6E6E2">
        <label style="display: flex; flex-direction: column; gap: 10px">
          <span style="font-size: 15px; font-weight: 600">그때 가장 크게 느낀 감정은?</span>
          <textarea rows="1" style="border: 0; padding: 0; resize: none; font: inherit; font-size: 16px; line-height: 1.7; color: #111113; background: transparent; outline: none">슬펐다</textarea>
        </label>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 14px; border-radius: 12px; background: #FFF4E5">
          <span style="font-size: 14px; line-height: 1.5; color: #8A4B00">‘슬펐다’에서 한 걸음만 더. 무엇이 슬펐나요?</span>
          <button type="button" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #E8C79A; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; color: #8A4B00; cursor: pointer">‘왜?’ 한 번 더 묻기</button>
        </div>
      </div>

      <label style="display: flex; flex-direction: column; gap: 10px; padding: 20px 22px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E6E6E2">
        <span style="font-size: 15px; font-weight: 600">예상과 달랐던 부분은?</span>
        <textarea rows="2" placeholder="작은 차이나 궁금증도 좋아요" style="border: 0; padding: 0; resize: none; font: inherit; font-size: 16px; line-height: 1.7; color: #111113; background: transparent; outline: none"></textarea>
      </label>

      <label style="display: flex; flex-direction: column; gap: 10px; padding: 20px 22px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E6E6E2">
        <span style="font-size: 15px; font-weight: 600">이 장면과 이어지는 내 경험이나 생각은?</span>
        <textarea rows="2" placeholder="확신이 없다면 추측이어도 괜찮아요" style="border: 0; padding: 0; resize: none; font: inherit; font-size: 16px; line-height: 1.7; color: #111113; background: transparent; outline: none"></textarea>
      </label>

      <label style="display: flex; flex-direction: column; gap: 10px; padding: 20px 22px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E6E6E2">
        <span style="font-size: 15px; font-weight: 600">아직 남아 있는 질문은?</span>
        <textarea rows="2" style="border: 0; padding: 0; resize: none; font: inherit; font-size: 16px; line-height: 1.7; color: #111113; background: transparent; outline: none">고통을 받아들인다는 것은 체념일까, 성숙일까?</textarea>
      </label>
    </div>

    <div style="margin-top: 40px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap">
      <a href="Capture.dc.html" style="height: 56px; padding: 0 22px; border-radius: 16px; border: 1px solid #E6E6E2; background: #FFFFFF; font-size: 16px; font-weight: 500; display: inline-flex; align-items: center">이전</a>
      <a href="Compose.dc.html" style="height: 56px; padding: 0 28px; border-radius: 16px; background: #111113; color: #FFFFFF; font-size: 16px; font-weight: 600; display: inline-flex; align-items: center; gap: 10px">
        다음 · 정리하기
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
      </a>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F4BE0","options":["#2F4BE0","#111113","#C2410C","#0F766E"]},"$preview":{"width":1280,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#2F4BE0' };
  }
}
</script>
</body>
</html>
