<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>감상 남기기 — 분류 선택</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111113;text-decoration:none}a:hover{color:#2F4BE0}
</style>
</helmet>
<div style="min-height: 960px; background: #F6F6F4; color: #111113; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; word-break: keep-all">
  <header style="max-width: 960px; margin: 0 auto; padding: 28px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
    <a href="Main.dc.html" aria-label="홈으로" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E6E6E2; display: inline-flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111113" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18"></path><path d="M6 6l12 12"></path></svg>
    </a>
    <span style="font-size: 14px; color: #66666C">새 감상</span>
    <span style="width: 44px"></span>
  </header>

  <main style="max-width: 720px; margin: 0 auto; padding: 16px 24px 96px">
    <h1 style="margin: 0 0 8px; font-size: 34px; line-height: 1.3; font-weight: 700; letter-spacing: -0.03em">무엇을 보고 왔나요?</h1>
    <p style="margin: 0 0 32px; font-size: 16px; color: #66666C">고른 분류에 맞춰 질문과 힌트가 달라져요.</p>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <button type="button" onClick="{{pickPerformance}}" style="text-align: left; padding: 24px; border-radius: 20px; background: #FFFFFF; border: {{borderPerformance}}; font: inherit; color: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 14px">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#111113" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18v4a3 3 0 0 0 0 6v4H3v-4a3 3 0 0 0 0-6V5z"></path><path d="M14 5v14" stroke-dasharray="2 2"></path></svg>
        <span style="font-size: 19px; font-weight: 600">공연</span>
        <span style="font-size: 14px; line-height: 1.5; color: #66666C">연극 · 뮤지컬 · 무용 · 콘서트</span>
      </button>
      <button type="button" onClick="{{pickExhibition}}" style="text-align: left; padding: 24px; border-radius: 20px; background: #FFFFFF; border: {{borderExhibition}}; font: inherit; color: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 14px">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#111113" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="1"></rect><path d="M3 15l5-5 4 4 3-3 6 6"></path><path d="M8 21h8"></path></svg>
        <span style="font-size: 19px; font-weight: 600">전시</span>
        <span style="font-size: 14px; line-height: 1.5; color: #66666C">미술관 · 갤러리 · 사진전</span>
      </button>
      <button type="button" onClick="{{pickBook}}" style="text-align: left; padding: 24px; border-radius: 20px; background: #FFFFFF; border: {{borderBook}}; font: inherit; color: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 14px">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#111113" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5z"></path><path d="M4 19a2 2 0 0 1 2-2h13"></path></svg>
        <span style="font-size: 19px; font-weight: 600">책</span>
        <span style="font-size: 14px; line-height: 1.5; color: #66666C">소설 · 에세이 · 희곡 · 비평</span>
      </button>
      <button type="button" onClick="{{pickFair}}" style="text-align: left; padding: 24px; border-radius: 20px; background: #FFFFFF; border: {{borderFair}}; font: inherit; color: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 14px">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#111113" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>
        <span style="font-size: 19px; font-weight: 600">박람회 · 기타</span>
        <span style="font-size: 14px; line-height: 1.5; color: #66666C">도서전 · 아트페어 · 팝업</span>
      </button>
    </div>

    <div style="margin-top: 40px; display: flex; flex-direction: column; gap: 20px">
      <label style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 14px; font-weight: 600">작품명</span>
        <input type="text" value="갈매기" style="height: 52px; padding: 0 16px; border-radius: 14px; border: 1px solid #E6E6E2; background: #FFFFFF; font: inherit; font-size: 17px; color: #111113">
      </label>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <label style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 14px; font-weight: 600">관람일</span>
          <input type="text" value="2026. 10. 26" style="height: 52px; padding: 0 16px; border-radius: 14px; border: 1px solid #E6E6E2; background: #FFFFFF; font: inherit; font-size: 16px; color: #111113">
        </label>
        <label style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 14px; font-weight: 600">장소 <span style="font-weight: 400; color: #66666C">(선택)</span></span>
          <input type="text" placeholder="공연장, 미술관 등" style="height: 52px; padding: 0 16px; border-radius: 14px; border: 1px solid #E6E6E2; background: #FFFFFF; font: inherit; font-size: 16px; color: #111113">
        </label>
      </div>
    </div>

    <a href="Capture.dc.html" style="margin-top: 40px; height: 60px; border-radius: 16px; background: #111113; color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px">
      작성 시작
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
    </a>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F4BE0","options":["#2F4BE0","#111113","#C2410C","#0F766E"]},"$preview":{"width":1280,"height":960}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'performance' };
  }
  renderVals() {
    const accent = this.props.accent ?? '#2F4BE0';
    const b = (id) => (this.state.picked === id ? `2px solid ${accent}` : '1px solid #E6E6E2');
    const pick = (id) => () => this.setState({ picked: id });
    return {
      accent,
      borderPerformance: b('performance'),
      borderExhibition: b('exhibition'),
      borderBook: b('book'),
      borderFair: b('fair'),
      pickPerformance: pick('performance'),
      pickExhibition: pick('exhibition'),
      pickBook: pick('book'),
      pickFair: pick('fair')
    };
  }
}
</script>
</body>
</html>
