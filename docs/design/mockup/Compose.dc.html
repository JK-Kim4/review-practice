<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>감상 작성 — 정리하기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111113;text-decoration:none}a:hover{color:#2F4BE0}
</style>
</helmet>
<div style="min-height: 1180px; background: #F6F6F4; color: #111113; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; word-break: keep-all">
  <header style="background: #FFFFFF; border-bottom: 1px solid #E6E6E2">
    <div style="max-width: 1120px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
      <a href="Main.dc.html" aria-label="닫기" style="width: 44px; height: 44px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111113" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18"></path><path d="M6 6l12 12"></path></svg>
      </a>
      <span style="display: flex; align-items: center; gap: 8px; font-size: 15px">
        <span style="font-size: 12px; font-weight: 600; color: #4A4A50; padding: 2px 8px; border-radius: 6px; background: #F0F0EC">공연</span>
        <strong style="font-weight: 600">갈매기</strong>
      </span>
      <span style="font-size: 13px; color: #66666C; min-width: 44px; text-align: right">저장됨</span>
    </div>
    <nav aria-label="작성 단계" style="max-width: 720px; margin: 0 auto; padding: 0 24px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <a href="Capture.dc.html" style="padding: 12px 0 14px; border-bottom: 2px solid transparent; font-size: 15px; color: #66666C; text-align: center">1 포착하기</a>
      <a href="Question.dc.html" style="padding: 12px 0 14px; border-bottom: 2px solid transparent; font-size: 15px; color: #66666C; text-align: center">2 질문하기</a>
      <a href="Compose.dc.html" aria-current="step" style="padding: 12px 0 14px; border-bottom: 2px solid #111113; font-size: 15px; font-weight: 600; text-align: center">3 정리하기</a>
    </nav>
  </header>

  <main style="max-width: 1120px; margin: 0 auto; padding: 48px 24px 120px; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">
    <section style="flex: 999 1 560px; min-width: 0">
      <h1 style="margin: 0 0 10px; font-size: 32px; line-height: 1.3; font-weight: 700; letter-spacing: -0.03em">한 편으로 정리하기</h1>
      <p style="margin: 0 0 28px; font-size: 16px; line-height: 1.6; color: #4A4A50">줄거리나 배경 설명은 없어도 돼요. 하나의 장면에서 내 생각으로 넓혀보세요.</p>

      <div style="background: #FFFFFF; border: 1px solid #E6E6E2; border-radius: 24px; padding: 32px 32px 24px">
        <input type="text" aria-label="제목" value="니나가 떠난 뒤의 적막" style="width: 100%; box-sizing: border-box; border: 0; padding: 0 0 20px; margin-bottom: 8px; border-bottom: 1px solid #EEEEEB; font: inherit; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; color: #111113; background: transparent; outline: none">

        <sc-for list="{{sections}}" as="s" hint-placeholder-count="4">
          <label style="display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 16px; padding: 18px 0; border-bottom: {{s.border}}">
            <span style="display: flex; flex-direction: column; gap: 2px; padding-top: 3px">
              <span style="font-size: 14px; font-weight: 600; color: #111113">{{s.label}}</span>
              <span style="font-size: 12px; color: #66666C">{{s.guide}}</span>
            </span>
            <textarea rows="{{s.rows}}" placeholder="{{s.placeholder}}" style="border: 0; padding: 0; resize: none; font: inherit; font-size: 17px; line-height: 1.8; color: #111113; background: transparent; outline: none">{{s.text}}</textarea>
          </label>
        </sc-for>

        <div style="margin-top: 20px; display: flex; align-items: center; gap: 16px">
          <div style="flex: 1; height: 6px; border-radius: 999px; background: #EEEEEB; overflow: hidden">
            <div style="width: 79%; height: 6px; border-radius: 999px; background: {{accent}}"></div>
          </div>
          <span style="font-size: 14px; color: #4A4A50; font-variant-numeric: tabular-nums">238 / 300자</span>
        </div>
      </div>

      <div style="margin-top: 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap">
        <a href="Question.dc.html" style="height: 56px; padding: 0 22px; border-radius: 16px; border: 1px solid #E6E6E2; background: #FFFFFF; font-size: 16px; font-weight: 500; display: inline-flex; align-items: center">이전</a>
        <a href="Detail.dc.html" style="height: 56px; padding: 0 32px; border-radius: 16px; background: #111113; color: #FFFFFF; font-size: 16px; font-weight: 600; display: inline-flex; align-items: center; gap: 10px">
          감상 완료
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
        </a>
      </div>
    </section>

    <aside style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
      <div style="padding: 22px; border-radius: 20px; background: #EDEDEA">
        <h2 style="margin: 0 0 4px; font-size: 16px; font-weight: 700">내가 적은 재료</h2>
        <p style="margin: 0 0 16px; font-size: 13px; line-height: 1.5; color: #4A4A50">누르면 지금 쓰는 칸에 들어가요.</p>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <sc-for list="{{materials}}" as="m" hint-placeholder-count="4">
            <button type="button" style="text-align: left; padding: 12px 14px; border-radius: 12px; border: 0; background: #FFFFFF; font: inherit; color: #111113; cursor: pointer; display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 12px; font-weight: 600; color: #66666C">{{m.from}}</span>
              <span style="font-size: 14px; line-height: 1.55">{{m.text}}</span>
            </button>
          </sc-for>
        </div>
      </div>
    </aside>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F4BE0","options":["#2F4BE0","#111113","#C2410C","#0F766E"]},"$preview":{"width":1280,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    const sections = [
      { label: '도입', guide: '1~2문장', rows: 2, placeholder: '가장 크게 남은 인상', text: '공연이 끝나고 가장 오래 남은 것은 니나가 떠난 뒤의 적막이었다.' },
      { label: '묘사', guide: '2~3문장', rows: 3, placeholder: '기억에 남는 구체적인 장면', text: '마지막 대화에서 니나는 고통스러운 삶을 이야기하면서도 여전히 배우로 살아가겠다는 의지를 드러냈다. 그런데 나는 그 모습이 희망차기보다는 쓸쓸하게 느껴졌다.' },
      { label: '감상', guide: '3~5문장', rows: 3, placeholder: '그 장면이 불러온 감정과 해석', text: '어쩌면 내가 생각하는 성장은 고통을 극복하는 일이었기 때문일 것이다.' },
      { label: '마무리', guide: '1~2문장', rows: 2, placeholder: '작품을 보고 남은 생각이나 질문', text: '' }
    ];
    const materials = [
      { from: '포착 · 장면 2', text: '니나가 떠난 뒤 트레플레프에게 남겨진 시간' },
      { from: '질문 · 기억에 남은 이유', text: '불행을 말하면서도 삶을 포기하지 않는 모습이 모순적으로 느껴졌다.' },
      { from: '질문 · 남은 질문', text: '고통을 받아들인다는 것은 체념일까, 성숙일까?' }
    ];
    return {
      accent: this.props.accent ?? '#2F4BE0',
      sections: sections.map((s, i) => ({ ...s, border: i === sections.length - 1 ? '0' : '1px solid #EEEEEB' })),
      materials
    };
  }
}
</script>
</body>
</html>
