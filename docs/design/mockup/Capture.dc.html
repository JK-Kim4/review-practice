<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>감상 작성 — 포착하기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111113;text-decoration:none}a:hover{color:#2F4BE0}
</style>
</helmet>
<div style="min-height: 1040px; background: #F6F6F4; color: #111113; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; word-break: keep-all">
  <header style="background: #FFFFFF; border-bottom: 1px solid #E6E6E2">
    <div style="max-width: 960px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
      <a href="Main.dc.html" aria-label="닫기" style="width: 44px; height: 44px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111113" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18"></path><path d="M6 6l12 12"></path></svg>
      </a>
      <span style="display: flex; align-items: center; gap: 8px; font-size: 15px">
        <span style="font-size: 12px; font-weight: 600; color: #4A4A50; padding: 2px 8px; border-radius: 6px; background: #F0F0EC">공연</span>
        <strong style="font-weight: 600">갈매기</strong>
      </span>
      <span style="font-size: 13px; color: #66666C; min-width: 44px; text-align: right">저장됨</span>
    </div>
    <nav aria-label="작성 단계" style="max-width: 720px; margin: 0 auto; padding: 0 24px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <a href="Capture.dc.html" aria-current="step" style="padding: 12px 0 14px; border-bottom: 2px solid #111113; font-size: 15px; font-weight: 600; text-align: center">1 포착하기</a>
      <a href="Question.dc.html" style="padding: 12px 0 14px; border-bottom: 2px solid transparent; font-size: 15px; color: #66666C; text-align: center">2 질문하기</a>
      <a href="Compose.dc.html" style="padding: 12px 0 14px; border-bottom: 2px solid transparent; font-size: 15px; color: #66666C; text-align: center">3 정리하기</a>
    </nav>
  </header>

  <main style="max-width: 720px; margin: 0 auto; padding: 48px 24px 120px">
    <h1 style="margin: 0 0 10px; font-size: 32px; line-height: 1.3; font-weight: 700; letter-spacing: -0.03em">무엇이 남았나요?</h1>
    <p style="margin: 0 0 20px; font-size: 16px; line-height: 1.6; color: #4A4A50">해석하거나 평가하지 말고, 기억나는 장면을 있는 그대로 적어보세요.</p>
    <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px">
      <span style="font-size: 14px; color: #4A4A50; padding: 6px 12px; border-radius: 999px; background: #EDEDEA">대사</span>
      <span style="font-size: 14px; color: #4A4A50; padding: 6px 12px; border-radius: 999px; background: #EDEDEA">표정</span>
      <span style="font-size: 14px; color: #4A4A50; padding: 6px 12px; border-radius: 999px; background: #EDEDEA">침묵</span>
      <span style="font-size: 14px; color: #4A4A50; padding: 6px 12px; border-radius: 999px; background: #EDEDEA">움직임</span>
      <span style="font-size: 14px; color: #4A4A50; padding: 6px 12px; border-radius: 999px; background: #EDEDEA">조명</span>
      <span style="font-size: 14px; color: #4A4A50; padding: 6px 12px; border-radius: 999px; background: #EDEDEA">무대 구성</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 16px">
      <label style="display: flex; flex-direction: column; gap: 10px; padding: 20px 22px; border-radius: 20px; background: #FFFFFF; border: 2px solid {{accent}}">
        <span style="font-size: 14px; font-weight: 600; color: {{accent}}">장면 1</span>
        <textarea rows="3" style="border: 0; padding: 0; resize: none; font: inherit; font-size: 17px; line-height: 1.7; color: #111113; background: transparent; outline: none">니나가 자신의 고통을 이야기하면서도 배우로 살아가겠다는 의지를 보였다.</textarea>
      </label>
      <label style="display: flex; flex-direction: column; gap: 10px; padding: 20px 22px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E6E6E2">
        <span style="font-size: 14px; font-weight: 600; color: #4A4A50">장면 2</span>
        <textarea rows="3" style="border: 0; padding: 0; resize: none; font: inherit; font-size: 17px; line-height: 1.7; color: #111113; background: transparent; outline: none">니나가 떠난 뒤 트레플레프에게 남겨진 시간</textarea>
      </label>
      <label style="display: flex; flex-direction: column; gap: 10px; padding: 20px 22px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E6E6E2">
        <span style="font-size: 14px; font-weight: 600; color: #4A4A50">장면 3 <span style="font-weight: 400; color: #66666C">(선택)</span></span>
        <textarea rows="3" placeholder="유독 오래 바라본 것, 보여주지 않았는데 크게 느껴진 것" style="border: 0; padding: 0; resize: none; font: inherit; font-size: 17px; line-height: 1.7; color: #111113; background: transparent; outline: none"></textarea>
      </label>
    </div>

    <div style="margin-top: 40px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap">
      <button type="button" style="height: 44px; padding: 0; border: 0; background: transparent; font: inherit; font-size: 15px; color: #4A4A50; text-decoration: underline; text-underline-offset: 4px; cursor: pointer">예시 보기</button>
      <a href="Question.dc.html" style="height: 56px; padding: 0 28px; border-radius: 16px; background: #111113; color: #FFFFFF; font-size: 16px; font-weight: 600; display: inline-flex; align-items: center; gap: 10px">
        다음 · 질문하기
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
      </a>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F4BE0","options":["#2F4BE0","#111113","#C2410C","#0F766E"]},"$preview":{"width":1280,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#2F4BE0' };
  }
}
</script>
</body>
</html>
